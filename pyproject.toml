[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omat-krypto-lompakot"
version = "0.1.0"
description = "Moniketjuinen ja monipörssinen lompakko- ja portfoliokeskitin (read-only hub) paikallisella hallintapaneelilla ja MCP-rajapinnalla"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KoodiHauki" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "keyring>=24.3.0",
    "ccxt>=4.4.0",
    "web3>=7.0.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
omat-krypto-hub = "omat_krypto_lompakot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "e2e: End-to-end tests requiring running hub server",
]
